version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: partzuf-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./partzuf_yomi.db}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: partzuf-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: partzuf-postgres
    environment:
      POSTGRES_DB: partzuf_yomi
      POSTGRES_USER: partzuf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partzuf_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - production

  redis:
    image: redis:7-alpine
    container_name: partzuf-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles:
      - production

volumes:
  backend-data:
  postgres-data:
