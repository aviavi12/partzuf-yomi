name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf https://partzuf-yomi-backend.onrender.com/health || echo "Server waking up..."
          sleep 5
          curl -sf https://partzuf-yomi-backend.onrender.com/health || echo "Still waking..."
