services:
  - type: web
    name: partzuf-yomi-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./partzuf_yomi.db
      - key: HOURLY_COLLECTION_ENABLED
        value: "true"
      - key: DAILY_SYNTHESIS_HOUR
        value: "18"
      - key: TIMEZONE
        value: Asia/Jerusalem
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: AI_PROVIDER
        value: none
    healthCheckPath: /health
